[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kinco-canopen-pp"
version = "0.3.1"
description = "Kinco servo CANopen Profile Position controller"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["canopen>=2.3,<3", "python-can>=4.3,<5"]

[project.scripts]
kinco-pp = "kinco_pp.cli:main"
kinco-pp-group = "kinco_pp.group_cli:main"
kinco-pp-reciprocate = "kinco_pp.reciprocate:main"

[tool.setuptools.packages.find]
where = ["src"]
